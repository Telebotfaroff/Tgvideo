name: Test Telegram Upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgvideo-telegram-upload-smoke-test
  cancel-in-progress: false

jobs:
  upload-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify bot and destination permissions
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_TARGET: ${{ secrets.TELEGRAM_TARGET }}
          PYROGRAM_PEER_SOURCE: ${{ secrets.PYROGRAM_PEER_SOURCE }}
          PYROGRAM_SESSION_STRING: ${{ secrets.PYROGRAM_SESSION_STRING }}
          PYROGRAM_CHANNEL_ACCESS_HASH: ${{ secrets.PYROGRAM_CHANNEL_ACCESS_HASH }}
        run: python -m src.telegram_check

      - name: Upload a real 2-second smoke-test video
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_TARGET: ${{ secrets.TELEGRAM_TARGET }}
          PYROGRAM_PEER_SOURCE: ${{ secrets.PYROGRAM_PEER_SOURCE }}
          PYROGRAM_SESSION_STRING: ${{ secrets.PYROGRAM_SESSION_STRING }}
          PYROGRAM_CHANNEL_ACCESS_HASH: ${{ secrets.PYROGRAM_CHANNEL_ACCESS_HASH }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m src.telegram_upload_smoke_test
