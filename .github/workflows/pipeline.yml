name: Tgvideo pipeline

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: "Javtiful studio/channel listing URL"
        required: true
        type: string
      operation:
        description: "Choose what the run should do"
        required: true
        default: scan
        type: choice
        options:
          - scan
          - process
          - resume
          - retry_failed
      batch_size:
        description: "Maximum videos processed in this run"
        required: true
        default: "10"
        type: string
      dry_run:
        description: "Do not download/upload (scan still saves its inventory)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: tgvideo-channel-state
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CHANNEL_URL: ${{ inputs.channel_url }}
      OPERATION: ${{ inputs.operation }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      DRY_RUN: ${{ inputs.dry_run }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_TARGET: ${{ secrets.TELEGRAM_TARGET }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ["CHANNEL_URL"].strip()
          parsed = urlparse(raw)
          if parsed.scheme != "https" or parsed.hostname != "javtiful.com":
              raise SystemExit("channel_url must be an HTTPS javtiful.com URL")
          if not parsed.path.startswith("/channel/"):
              raise SystemExit("channel_url must be a /channel/... page")
          try:
              size = int(os.environ["BATCH_SIZE"])
          except ValueError:
              raise SystemExit("batch_size must be an integer")
          if not 1 <= size <= 100:
              raise SystemExit("batch_size must be between 1 and 100")
          print(f"Input validated; operation={os.environ['OPERATION']}; batch size={size}")
          PY

      - name: Run pipeline
        run: python -m src.main

      - name: Commit remaining database changes
        if: always()
        run: |
          if git diff --quiet -- database; then
            echo "No uncommitted database changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database
          git commit -m "chore: persist channel inventory and processing state"
          git push

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgvideo-run-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean temporary storage
        if: always()
        run: rm -rf tmp/downloads/*
