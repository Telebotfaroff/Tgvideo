name: Telegram Auto Uploader

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: "Destination Telegram channel URL, @username, or numeric channel ID"
        required: true
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: tgvideo-auto-uploader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate JSON files
        run: |
          python -m json.tool database/authorized_media.json >/dev/null
          python -m json.tool database/processed.json >/dev/null

      - name: Run tests
        run: python -m pytest -q

      - name: Process manifest
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_TARGET: ${{ inputs.channel_url || secrets.TELEGRAM_TARGET }}
          MAX_ITEM_ATTEMPTS: "5"
          LOG_LEVEL: INFO
        run: python -m app.main

      - name: Save checkpoint
        if: always()
        run: |
          if ! git diff --quiet -- database/processed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add database/processed.json
            git commit -m "chore(checkpoint): save uploader progress"
            git push
          fi
